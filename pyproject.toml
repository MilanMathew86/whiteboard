[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chalkback"
version = "0.1.0"
description = "ChalkBack whiteboard: Flask server with Google sign-in, account boards, sharing and admin"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.0,<5",
  "Flask-Limiter>=3.5,<4",
  "Authlib>=1.3,<2",
  "requests>=2.31",
  "python-dotenv>=1.0",  # lets `flask run` read .env
  "psycopg[binary]>=3.1",  # PostgreSQL, used in production
  "gunicorn>=22; platform_system != 'Windows'",
]

[project.optional-dependencies]
postgres = []  # kept so `pip install -e ".[dev,postgres]"` still works; psycopg is a main dependency
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "playwright>=1.45",
  "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
where = ["server"]
include = ["chalkback*"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-q"
markers = ["postgres: needs TEST_DATABASE_URL pointing at PostgreSQL"]

[tool.coverage.run]
source = ["chalkback"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["server/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.isort]
known-first-party = ["chalkback", "conftest"]

[tool.ruff.lint.per-file-ignores]
"server/tests/**" = ["S105", "S106"]  # fake tokens and secrets in tests
"server/e2e/**" = ["S105", "S106"]
