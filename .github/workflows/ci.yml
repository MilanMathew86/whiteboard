name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Lint, tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chalkback
          POSTGRES_PASSWORD: chalkback
          POSTGRES_DB: chalkback_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chalkback" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://chalkback:chalkback@localhost:5432/chalkback_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check server
      - run: pytest --cov --cov-report=term
      - run: node --check web/app.js && node --check web/admin.js

  e2e:
    name: Browser tests (Chromium + WebKit)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium webkit
      - run: pytest server/e2e --browser chromium --browser webkit --tracing retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
